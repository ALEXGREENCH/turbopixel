<div class="sheet-grabber" aria-hidden="true"></div>
<header class="sheet-header"><h1 mat-dialog-title>Camera unavailable</h1></header>
<div mat-dialog-content><p>Allow camera access in your browser’s site settings, or open a photo from your device.</p></div>
<div mat-dialog-actions class="camera-error-actions"><button class="prominent-button" [mat-dialog-close]="CameraErrorDialogResult.TryAgain">Try again</button><button class="plain-button" mat-dialog-close>Use a photo instead</button></div>
