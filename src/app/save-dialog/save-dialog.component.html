<div class="sheet-header">
    <h1 mat-dialog-title>Your pixel photo</h1>
    <button mat-button [disabled]="busy" [mat-dialog-close]="SaveDialogResult.Cancel">Done</button>
</div>
<div mat-dialog-content>
    <img *ngIf="previewUrl" [src]="previewUrl" class="photo-preview" alt="Your captured photo with the selected pixel effect">
    <p class="export-note">Full-resolution PNG · ready to keep</p>
    <p class="caption selectable">{{data.description}}</p>
    <button mat-button (click)="copyDescription()">Copy caption</button>
    <p class="status" role="status" aria-live="polite">{{status}}</p>
    <p *ngIf="error" class="error" role="alert">{{error}}</p>
</div>
<div mat-dialog-actions class="export-actions">
    <button mat-flat-button color="primary" [disabled]="!file || busy" (click)="clickSave()">Download PNG</button>
    <button *ngIf="allowShare" mat-stroked-button [disabled]="busy" (click)="clickShare()">Share / Save to Photos</button>
    <button *ngIf="allowCopy" mat-button [disabled]="!file || busy" (click)="clickCopy()">Copy photo</button>
</div>
<p class="save-hint">On iPhone or iPad, choose Share to save to Photos or Files. You can also touch and hold the preview.</p>
