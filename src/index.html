<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TurboPixel</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TurboPixel">
    <meta name="description" content="Pixel effects for photos and camera, with PNG export. Processing runs on your device.">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f0f1f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131419" media="(prefers-color-scheme: dark)">
</head>

<body>
    <app-root></app-root>
    <script>
        // Recovery must not depend on a hashed application bundle being available.
        (function () {
            var shown = false;
            function recover() {
                if (shown || document.querySelector('app-root').children.length) return;
                shown = true;
                var notice = document.createElement('p');
                notice.style.cssText = 'padding:24px;font:16px system-ui;line-height:1.5';
                notice.textContent = 'Unable to open TurboPixel. Connect to the internet and retry. ';
                var retry = document.createElement('button');
                retry.textContent = 'Retry';
                retry.style.cssText = 'font:inherit;min-height:44px;padding:8px 16px';
                retry.onclick = function () {
                    var url = new URL(document.baseURI);
                    url.searchParams.set('ngsw-bypass', 'true');
                    url.searchParams.set('refresh', String(Date.now()));
                    location.replace(url.href);
                };
                notice.appendChild(retry); document.body.appendChild(notice);
                new MutationObserver(function (_, observer) {
                    if (document.querySelector('app-root').children.length) { notice.remove(); observer.disconnect(); }
                }).observe(document.querySelector('app-root'), { childList: true });
            }
            window.addEventListener('error', function (event) {
                if (event.target && event.target.tagName === 'SCRIPT') recover();
            }, true);
            setTimeout(recover, 10000);
        })();
    </script>
    <noscript>Please enable JavaScript to continue using this application.</noscript>


</body>

</html>
